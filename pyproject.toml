[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auralyn-click"
version = "2.4.4"
description = "Modern cross-platform auto clicker for Windows and Linux, built with Python and Qt 6"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Julius0406" }]
dependencies = [
  "PySide6>=6.8,<7",
  "pynput>=1.7.7,<2"
]
keywords = ["linux", "windows", "autoclicker", "qt6", "pyside6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment"
]

[project.scripts]
auralyn-click = "auralyn_click.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auralyn_click = ["assets/*.png", "assets/*.svg", "assets/*.ico"]
