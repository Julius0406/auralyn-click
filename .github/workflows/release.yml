name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 dpkg-dev
          python -m pip install --upgrade pip
      - name: Build Linux assets
        run: |
          chmod +x packaging/linux/build-linux.sh
          ./packaging/linux/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
      - name: Build Windows assets
        shell: powershell
        run: .\packaging\windows\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
